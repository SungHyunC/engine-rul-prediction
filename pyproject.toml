[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncmapss-rul-project"
version = "0.1.0"
description = "DCCS 410 parallel HDF5 processing and engine remaining useful life prediction"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "h5py>=3.11,<4", "scikit-learn>=1.5,<2", "pyarrow>=16,<24", "psutil>=5.9,<8", "matplotlib>=3.9,<4", "requests>=2.32,<3", "threadpoolctl>=3.5,<4", "joblib>=1.4,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
neural = ["torch==2.5.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
